services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tourism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourism}
      POSTGRES_DB: ${POSTGRES_DB:-tourism}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/migrations-complete"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminctl:
    build: ./backend
    profiles: ["tools"]
    entrypoint: ["/adminctl"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://tourism:tourism@postgres:5432/tourism?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy

  seed-demo:
    image: postgres:16-alpine
    profiles: ["demo"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-tourism}
    volumes:
      - ./db/seeds:/seeds:ro
    command: ["psql", "-h", "postgres", "-U", "${POSTGRES_USER:-tourism}", "-d", "${POSTGRES_DB:-tourism}", "-f", "/seeds/2026-10-demo-visits.sql"]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-12003}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://tourism:tourism@postgres:5432/tourism?sslmode=disable}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      API_PORT: ${API_PORT:-8080}
      SITE_ID: ${SITE_ID:-11111111-1111-1111-1111-111111111111}
      OPEN_METEO_URL: ${OPEN_METEO_URL:-https://api.open-meteo.com/v1/forecast}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-8h}
      CLOSURE_HOUR: ${CLOSURE_HOUR:-18}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-false}
      DEMO_TENANT_ID: ${DEMO_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      DEMO_USER_NAME: ${DEMO_USER_NAME:-Operador de demostración}
      DEMO_USER_ROLE: ${DEMO_USER_ROLE:-manager}
      APP_ENABLE_LEGACY_ROUTES: ${APP_ENABLE_LEGACY_ROUTES:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-12001}:${API_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ml-service:
    build: ./ml-service
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://tourism:tourism@postgres:5432/tourism}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      SITE_ID: ${SITE_ID:-11111111-1111-1111-1111-111111111111}
      OPEN_METEO_URL: ${OPEN_METEO_URL:-https://api.open-meteo.com/v1/forecast}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_healthy
    ports:
      - "${ML_HOST_PORT:-12002}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: ./backend
    entrypoint: ["/tourism-worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://tourism:tourism@postgres:5432/tourism?sslmode=disable}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      WORKER_ONCE: ${WORKER_ONCE:-false}
      CLOSURE_HOUR: ${CLOSURE_HOUR:-18}
      OPEN_METEO_URL: ${OPEN_METEO_URL:-https://api.open-meteo.com/v1/forecast}
      OPEN_METEO_ARCHIVE_URL: ${OPEN_METEO_ARCHIVE_URL:-https://archive-api.open-meteo.com/v1/archive}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -aq tourism-worker /proc/1/cmdline || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${FRONTEND_HOST_PORT:-12000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
