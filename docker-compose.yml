services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tourism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourism}
      POSTGRES_DB: ${POSTGRES_DB:-tourism}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint: ["migrate"]
    command: ["-path=/migrations", "-database=postgres://${POSTGRES_USER:-tourism}:${POSTGRES_PASSWORD:-tourism}@postgres:5432/${POSTGRES_DB:-tourism}?sslmode=disable", "up"]

  seed-demo:
    image: postgres:16-alpine
    profiles: ["demo"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-tourism}
    volumes:
      - ./db/seeds:/seeds:ro
    command: ["psql", "-h", "postgres", "-U", "${POSTGRES_USER:-tourism}", "-d", "${POSTGRES_DB:-tourism}", "-f", "/seeds/2026-10-demo-visits.sql"]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://tourism:tourism@postgres:5432/tourism?sslmode=disable}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      API_PORT: ${API_PORT:-8080}
      SITE_ID: ${SITE_ID:-11111111-1111-1111-1111-111111111111}
      OPEN_METEO_URL: ${OPEN_METEO_URL:-https://api.open-meteo.com/v1/forecast}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"

  ml-service:
    build: ./ml-service
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://tourism:tourism@postgres:5432/tourism}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      SITE_ID: ${SITE_ID:-11111111-1111-1111-1111-111111111111}
      OPEN_METEO_URL: ${OPEN_METEO_URL:-https://api.open-meteo.com/v1/forecast}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
