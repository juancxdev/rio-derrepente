[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "5s"
  perdevice_include = ["cpu", "blkio", "network"]
  total_include = ["cpu", "blkio", "network"]

# Las etiquetas de Compose que no se usan se descartan en Prometheus
# (metric_relabel_configs) para reducir cardinalidad.
[[outputs.prometheus_client]]
  listen = ":9273"
  path = "/metrics"
  metric_version = 2
