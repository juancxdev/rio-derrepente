global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: telegraf-docker
    static_configs:
      - targets: ["telegraf:9273"]
    metric_relabel_configs:
      # Telegraf añade bastantes etiquetas de Compose que no se usan en los
      # dashboards y cambian entre despliegues. Se eliminan para reducir
      # cardinalidad y mantener estables las series.
      - regex: "com_docker_compose_(config_hash|depends_on|project_config_files|project_working_dir|version|container_number|oneoff|replace|image)|desktop_docker_io_.*|container_id|container_version|server_version|engine_host"
        action: labeldrop

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://frontend/
          - http://frontend/health
          - http://api:8080/health
          - http://ml-service:8000/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
