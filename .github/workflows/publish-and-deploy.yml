name: Test, publish images and refresh Coolify

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Test Go services
        working-directory: backend
        run: go test ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ML service
        working-directory: ml-service
        run: |
          python -m pip install -r requirements.txt
          python -m pytest

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API and Worker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rio-derrepente-api:latest
            ghcr.io/${{ github.repository_owner }}/rio-derrepente-api:${{ github.sha }}
      - name: Publish ML image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rio-derrepente-ml:latest
            ghcr.io/${{ github.repository_owner }}/rio-derrepente-ml:${{ github.sha }}
      - name: Refresh Coolify deployment
        if: ${{ env.COOLIFY_WEBHOOK != '' && env.COOLIFY_TOKEN != '' }}
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail --silent --show-error --retry 3 \
            --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
